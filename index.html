<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidsSave - Free Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; margin-top: 25px; text-align: center; height: fit-content; }
    h2 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px; }
    button { width: 100%; padding: 13px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #status { margin-top: 15px; font-size: 14px; color: #fbbf24; word-break: break-word; }
    #result { margin-top: 20px; display: none; }
    .dl-btn { display: inline-block; width: 100%; padding: 13px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>

<div class="card">
  <h2>VidsSave Video Downloader</h2>
  <p>Paste Instagram / Reel link below</p>

  <input type="text" id="videoUrl" placeholder="Paste link here..." />
  <button onclick="downloadVideo()">Get Video</button>

  <div id="status"></div>

  <div id="result">
    <a id="finalLink" class="dl-btn" href="#" target="_blank" rel="noopener noreferrer">Download Video</a>
  </div>
</div>

<script>
  async function downloadVideo() {
    let inputUrl = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result');
    const finalLink = document.getElementById('finalLink');

    if (!inputUrl) {
      alert("Pehle reel link paste karein!");
      return;
    }

    status.innerText = "Video dhoondi ja rahi hai...";
    resultBox.style.display = "none";

    inputUrl = inputUrl.split('?')[0];
    if (!inputUrl.endsWith('/')) {
      inputUrl += '/';
    }

    try {
      // Direct Instagram JSON fetch through CORS proxy
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(inputUrl + '?__a=1&__d=dis');
      const response = await fetch(proxyUrl);
      const data = await response.json();

      let videoUrl = null;
      if (data.graphql && data.graphql.shortcode_media) {
        videoUrl = data.graphql.shortcode_media.video_url;
      } else if (data.items && data.items[0]) {
        const item = data.items[0];
        videoUrl = item.video_versions ? item.video_versions[0].url : null;
      }

      if (videoUrl) {
        status.innerText = "Video mil gayi!";
        finalLink.href = videoUrl;
        resultBox.style.display = "block";
      } else {
        // Fallback open server without DNS blocks
        status.innerText = "Server par bheja ja raha hai...";
        window.open('https://fastdl.app/en?url=' + encodeURIComponent(inputUrl), '_blank');
      }
    } catch (e) {
      // FastDL server fallback
      status.innerText = "Download page open ho raha hai...";
      window.open('https://fastdl.app/en?url=' + encodeURIComponent(inputUrl), '_blank');
    }
  }
</script>

</body>
</html>
