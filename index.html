<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidsSave - Free Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; margin-top: 25px; text-align: center; height: fit-content; }
    h2 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px; }
    button { width: 100%; padding: 13px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    #status { margin-top: 15px; font-size: 14px; color: #fbbf24; }
  </style>
</head>
<body>

<div class="card">
  <h2>VidsSave Video Downloader</h2>
  <p>Paste Instagram / Reel link below</p>

  <input type="text" id="videoUrl" placeholder="Paste link here..." />
  <button onclick="downloadVideo()">Get Video</button>

  <div id="status"></div>
</div>

<script>
  function downloadVideo() {
    let inputUrl = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');

    if (!inputUrl) {
      alert("Pehle Instagram reel link paste karein!");
      return;
    }

    status.innerText = "Video server open ho raha hai...";
    inputUrl = inputUrl.split('?')[0];

    // India me permanently active server
    const targetUrl = "https://en.savefrom.net/393GA/#url=" + encodeURIComponent(inputUrl);

    setTimeout(() => {
      window.open(targetUrl, '_blank');
      status.innerText = "Server naye tab me open ho gaya hai!";
    }, 300);
  }
</script>

</body>
</html>
