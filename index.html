<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidsSave - Free Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; margin-top: 25px; text-align: center; }
    h2 { color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px; }
    button { width: 100%; padding: 13px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #status { margin-top: 15px; font-size: 14px; color: #fbbf24; word-break: break-word; }
    #result { margin-top: 20px; display: none; }
    .dl-btn { display: inline-block; width: 100%; padding: 13px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>

<div class="card">
  <h2>VidsSave Video Downloader</h2>
  <p>Paste Instagram link below</p>

  <input type="text" id="videoUrl" placeholder="Paste link here..." />
  <button onclick="downloadVideo()">Get Video</button>

  <div id="status"></div>

  <div id="result">
    <a id="finalLink" class="dl-btn" href="#" target="_blank">Download MP4</a>
  </div>
</div>

<script>
  async function downloadVideo() {
    let inputUrl = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result');
    const finalLink = document.getElementById('finalLink');

    if (!inputUrl) {
      alert("Pehle link paste karein!");
      return;
    }

    // URL se extra tracking tags (?stkn=...) hatana
    inputUrl = inputUrl.split('?')[0];

    status.innerText = "Video fetch ho rahi hai... kripya intezar karein";
    resultBox.style.display = "none";

    const apiKey = "30728598e5mshfa9a36c68c7f7d6p11d81cjsn24ccfbe20e38";
    const apiHost = "instagram-downloader-download-instagram-videos-stories1.p.rapidapi.com";
    const requestUrl = `https://${apiHost}/get-info?url=${encodeURIComponent(inputUrl)}`;

    try {
      const response = await fetch(requestUrl, {
        method: 'GET',
        headers: {
          'x-rapidapi-key': apiKey,
          'x-rapidapi-host': apiHost
        }
      });

      const data = await response.json();
      console.log("Response:", data);

      if (data.message && data.message.includes("not subscribed")) {
        status.innerText = "RapidAPI subscription sync hone mein 2-3 minute lagte hain. Thodi der baad try karein.";
        return;
      }

      // Har format mein download URL dhoondhna
      let dl = null;
      if (data.download_url) dl = data.download_url;
      else if (data.url) dl = data.url;
      else if (data.data && Array.isArray(data.data) && data.data[0]) dl = data.data[0].url || data.data[0].download_url;
      else if (data.media) dl = data.media;

      if (dl) {
        status.innerText = "Video ready!";
        finalLink.href = dl;
        resultBox.style.display = "block";
      } else {
        status.innerText = "Video link extract nahi hua. Kripya check karein link public hai ya nahi.";
      }
    } catch (err) {
      status.innerText = "Fetch error aaya. Ek baar internet connection check karein.";
      console.error(err);
    }
  }
</script>

</body>
</html>
