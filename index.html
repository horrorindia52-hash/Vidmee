<script>
  async function downloadVideo() {
    const inputUrl = document.getElementById('videoUrl').value.trim();
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result');
    const finalLink = document.getElementById('finalLink');

    if (!inputUrl) {
      alert("Pehle link paste karein!");
      return;
    }

    status.innerText = "Video fetch ho rahi hai... kripya intezar karein";
    resultBox.style.display = "none";

    const apiKey = "30728598e5mshfa9a36c68c7f7d6p11d81cjsn24ccfbe20e38";
    const apiHost = "instagram-downloader-download-instagram-videos-stories1.p.rapidapi.com";

    // Format clean URL
    const requestUrl = `https://${apiHost}/get-info?url=${encodeURIComponent(inputUrl)}`;

    try {
      const response = await fetch(requestUrl, {
        method: 'GET',
        headers: {
          'x-rapidapi-key': apiKey,
          'x-rapidapi-host': apiHost
        }
      });

      const data = await response.json();
      console.log(data);

      // Har format se download URL nikalne ki koshish
      let downloadUrl = data.download_url || data.url || data.media || (data.data && data.data[0] ? (data.data[0].url || data.data[0].download_url) : null);

      if (downloadUrl) {
        status.innerText = "Video ready!";
        finalLink.href = downloadUrl;
        resultBox.style.display = "block";
      } else if (data.message) {
        status.innerText = "API Notice: " + data.message;
      } else {
        status.innerText = "API Response error. Kripya dusra link try karein.";
      }
    } catch (err) {
      status.innerText = "Connection error. Internet ya RapidAPI limit check karein.";
      console.error(err);
    }
  }
</script>
